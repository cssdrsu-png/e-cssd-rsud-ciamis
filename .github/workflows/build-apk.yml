name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK Output
        run: |
          mkdir -p dist-apk
          APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_SOURCE" "dist-apk/E-CSSD RSUD Ciamis.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-CSSD-RSUD-Ciamis-apk
          path: dist-apk/E-CSSD RSUD Ciamis.apk
